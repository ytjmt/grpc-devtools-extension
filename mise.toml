[tools]
# Node comes from .node-version, which mise reads as well.
pnpm = "12.9.1"
buf = "1.73.0"
protoc = "36.2"

# Puts local bins such as `vp` on PATH, so they run without a global install.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Regenerates the demo code and the descriptor sets used by example/ and tests/.
[tasks."example:gen"]
dir = "{{config_root}}/example"
run = [
  "buf lint",
  "buf generate",
  "buf build -o descriptor.binpb",
  # Same schema via protoc *without* --include_imports, to exercise the well-known-type fallback.
  "protoc -I proto --descriptor_set_out=descriptor.protoc.binpb $(find proto -name '*.proto')",
]
