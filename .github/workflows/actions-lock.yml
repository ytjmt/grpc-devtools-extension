name: Actions lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - mise.toml
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          install_args: github:github/gh-actions-lock
      - run: gh-actions-lock --verify
