name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increment.
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Open release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pushes and PRs made with GITHUB_TOKEN do not trigger CI, so the release PR could never pass its required checks.
      - id: token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # open-pr pushes with the checkout's credentials.
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.token.outputs.token }}

      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          next=$(jq -r .version package.json | BUMP="$BUMP" node -e '
            const parts = require("fs").readFileSync(0, "utf8").trim().split(".").map(Number);
            while (parts.length < 3) parts.push(0);
            const i = ["major", "minor", "patch"].indexOf(process.env.BUMP);
            parts.splice(i, parts.length - i, parts[i] + 1, ...Array(2 - i).fill(0));
            console.log(parts.join("."));
          ')
          jq --arg v "$next" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - id: body
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish=main --jq .body)
          {
            echo 'text<<EOF'
            printf 'Merging this publishes %s to GitHub Releases once CI passes on main.\n\n## Release notes (draft)\n\n%s\n' "$TAG" "$notes"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/open-pr
        with:
          branch: release
          title: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.body.outputs.text }}
          token: ${{ steps.token.outputs.token }}
