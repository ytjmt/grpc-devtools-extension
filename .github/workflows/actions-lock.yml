name: Workflows and scripts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .claude/hooks/**
      - scripts/**
      - .github/actions/**
      - .github/actionlint.yaml
      - mise.toml
  pull_request:
    paths:
      - .github/workflows/**
      - .claude/hooks/**
      - scripts/**
      - .github/actions/**
      - .github/actionlint.yaml
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint and verify actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          install_args: github:github/gh-actions-lock aqua:rhysd/actionlint aqua:koalaman/shellcheck
      - run: actionlint
      - run: shellcheck .claude/hooks/*.sh scripts/*.sh
      - run: gh-actions-lock --verify
