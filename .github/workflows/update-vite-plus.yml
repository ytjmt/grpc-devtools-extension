name: Update Vite+

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Vite+
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: update-vite-plus
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup

      # The newest stable release that pnpm's minimumReleaseAge already lets in.
      - id: version
        run: |
          current=$(yq '.catalog."vite-plus"' pnpm-workspace.yaml)
          age=$(yq '.minimumReleaseAge // 0' pnpm-workspace.yaml)
          target=$(pnpm view vite-plus time --json | AGE="$age" node -e '
            const times = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const cutoff = Date.now() - Number(process.env.AGE) * 60_000;
            const parse = (v) => v.split(".").map(Number);
            const newer = (a, b) => {
              const [x, y] = [parse(a), parse(b)];
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
              return false;
            };
            const best = Object.keys(times)
              .filter((v) => /^\d+\.\d+\.\d+$/.test(v) && Date.parse(times[v]) <= cutoff)
              .reduce((a, b) => (a && !newer(b, a) ? a : b), "");
            console.log(best);
          ')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ -n "$target" ] && [ "$target" != "$current" ] \
            && [ "$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)" = "$target" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.update == 'true'
        run: pnpm --package=vite-plus@${{ steps.version.outputs.target }} dlx vp migrate --no-interactive --no-agent --no-editor --no-hooks

      # migrate exempts the toolchain from minimumReleaseAge; keep the repository's policy.
      - if: steps.version.outputs.update == 'true'
        run: |
          yq -i 'del(.minimumReleaseAgeExclude)' pnpm-workspace.yaml
          pnpm install

      - if: steps.version.outputs.update == 'true'
        uses: $/.github/actions/open-pr
        with:
          branch: ${{ env.BRANCH }}
          title: Update Vite+ from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.target }}
          body: Ran `vp migrate` with vite-plus ${{ steps.version.outputs.target }}, which re-pins vite-plus, the vite alias to @voidzero-dev/vite-plus-core and the Vitest packages together.
