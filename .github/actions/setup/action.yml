name: Set up
description: Install Node.js and pnpm as pinned in the repository, install dependencies, and put vp on PATH.

inputs:
  chromium:
    description: Also install Playwright's Chromium.
    default: "false"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5
      with:
        install_args: node pnpm
    # Only caches the pnpm store; Node and pnpm come from mise.
    - uses: actions/setup-node@v7
      with:
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # mise does this locally (mise.toml); vp is a local binary.
    - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      shell: bash
    # The browser download is cached per Playwright version. Its system dependencies
    # (--with-deps) are skipped: the runner image ships Chrome and so has the libraries,
    # and the extra fonts only matter for screenshots, which VRT takes in Docker.
    - if: inputs.chromium == 'true'
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.chromium == 'true'
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - if: inputs.chromium == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: vp exec playwright install chromium
      shell: bash
