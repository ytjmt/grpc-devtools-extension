# Fixed project name: every checkout shares one browser container (and port 3000).
name: grpc-devtools-extension

services:
  # Remote Chromium for VRT: tests run on the host, rendering happens in Linux.
  playwright:
    # The version comes from @playwright/test in package.json (`vp run test:vrt` sets it),
    # so the server always matches the client; a mismatch fails to connect.
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
    # The npm cache volume lets restarts skip the registry.
    command: npx --prefer-offline -y playwright@${PLAYWRIGHT_VERSION} run-server --port 3000 --host 0.0.0.0
    init: true
    ipc: host
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - npm-cache:/root/.npm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0), () => process.exit(1))"]
      interval: 1s
      retries: 120

volumes:
  npm-cache:
