name: Update mise tools

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update mise tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: update-mise-tools
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
        with:
          install: false

      # Same cooldown as pnpm's minimumReleaseAge.
      - id: upgrade
        run: |
          age=$(yq '.minimumReleaseAge // 0' pnpm-workspace.yaml)
          mise upgrade --bump --minimum-release-age "${age}m"
          if ! git diff --quiet mise.toml; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      # package.json pins pnpm as well; keep it and the lockfile in step with mise.toml.
      - if: steps.upgrade.outputs.update == 'true'
        run: |
          pnpm=$(mise current pnpm)
          jq --arg v "$pnpm" '.packageManager = "pnpm@\($v)" | .devEngines.packageManager.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          mise exec -- pnpm install

      # A new buf or protoc can change the generated example code; CI checks it is up to date.
      - if: steps.upgrade.outputs.update == 'true'
        run: |
          mise install buf protoc
          mise run example:gen

      - if: steps.upgrade.outputs.update == 'true'
        id: body
        run: |
          # shellcheck disable=SC2016 # literal backticks
          {
            echo 'text<<EOF'
            printf 'Ran `mise upgrade --bump`, synced pnpm in package.json, and regenerated the example code.\n\n```diff\n%s\n```\n' \
              "$(git diff -U0 -- mise.toml | grep '^[-+][^-+]')"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - if: steps.upgrade.outputs.update == 'true'
        uses: $/.github/actions/open-pr
        with:
          branch: ${{ env.BRANCH }}
          title: Update mise-managed tools
          body: ${{ steps.body.outputs.text }}
