# Fixed project name: every checkout shares one browser container (and port 3000).
name: grpc-devtools-extension

services:
  # Remote Chromium for VRT: tests run on the host, rendering happens in Linux.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    # The npm cache volume lets restarts skip the registry.
    command: ["npx", "--prefer-offline", "-y", "playwright@1.64.0", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    init: true
    ipc: host
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - npm-cache:/root/.npm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0), () => process.exit(1))"]
      interval: 1s
      retries: 120

volumes:
  npm-cache:
