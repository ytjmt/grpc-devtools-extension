minimumReleaseAge: 4320
allowBuilds:
  # tsx's esbuild verifies its platform binary in postinstall.
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/browser-playwright": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
