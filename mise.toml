[tools]
node = "26.13.0"
pnpm = "12.18.0"
buf = "1.75.0"
protoc = "36.2"
"github:github/gh-actions-lock" = { version = "0.4.1", bin = "gh-actions-lock" }
"aqua:rhysd/actionlint" = "1.7.12"

# Puts local bins such as `vp` on PATH, so they run without a global install.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Regenerates the demo code and the descriptor sets used by example/ and tests/.
[tasks."example:gen"]
dir = "{{config_root}}/example"
run = [
  "buf lint",
  "buf generate",
  "buf build -o descriptor.binpb",
  # Same schema via protoc *without* --include_imports, to exercise the well-known-type fallback.
  "protoc -I proto --descriptor_set_out=descriptor.protoc.binpb $(find proto -name '*.proto' | LC_ALL=C sort)",
]
