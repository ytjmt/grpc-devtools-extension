name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
        with:
          chromium: "true"
      - run: vp check
      - run: vp run test

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # buf generate runs protoc-gen-es from node_modules.
      - uses: $/.github/actions/setup
      - run: mise install buf protoc
      - run: mise run example:gen
      - run: git add -N . && git diff --exit-code --stat

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
        with:
          chromium: "true"
      - run: vp run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: tests/e2e/.results/
          if-no-files-found: ignore

  vrt:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # Chromium runs in the Playwright container from compose.yaml.
      - uses: $/.github/actions/setup
      - run: vp run test:vrt
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vrt-results
          path: .vitest/
          if-no-files-found: ignore

  # Publishes package.json's version once it has no tag yet; other pushes to main skip it.
  release:
    name: Release
    needs: [test, generated, e2e, vrt]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: $/.github/actions/setup
      - if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset=$(scripts/package.sh)
          gh release create "$TAG" "$asset" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
